<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Owner - Bimbel ALC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

  <!-- Container untuk Background Interaktif (Partikel Jaring) -->
  <div id="particles-js"></div>

  <!-- Kartu Login dengan Efek Glassmorphism -->
  <div class="card login-card">
    
    <!-- GAMBAR IKON LOGIN OWNER -->
    <div style="margin-bottom: 12px; display: flex; justify-content: center;">
      <img src="owner.png" alt="Login Owner Icon" style="width: 300px; height: auto; object-fit: contain;">
    </div>

    <h2 style="color: var(--primary); margin-bottom: 8px;">Login Owner</h2>
    <p style="color: var(--gray); font-size: 0.9rem; margin-bottom: 24px;">Masukkan password untuk mengakses Laporan Keuangan Bimbel ALC</p>

    <form id="login-form">
      <div class="form-group" style="text-align: left;">
        <label for="password">Password Owner</label>
        <input type="password" id="password" placeholder="Masukkan password" required>
      </div>
      <p id="error-msg" style="color: var(--danger); font-size: 0.85rem; display: none; margin-bottom: 12px;">Password salah, silakan coba lagi!</p>
      <button type="submit" class="btn btn-primary btn-full">Masuk ke Dashboard</button>
    </form>
    
    <div style="margin-top: 20px;">
      <a href="index.html" style="color: var(--gray); text-decoration: none; font-size: 0.85rem;"><i class="fa-solid fa-arrow-left"></i> Kembali ke Beranda</a>
    </div>
  </div>

  <!-- Library Particles.js & Script Inisialisasi -->
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script>
    const OWNER_PASSWORD = "adminalc2026"; // Password Owner Default

    if (sessionStorage.getItem("isOwnerLoggedIn") === "true") {
      window.location.href = "dashboard.html";
    }

    document.getElementById("login-form").addEventListener("submit", function(e) {
      e.preventDefault();
      const inputPass = document.getElementById("password").value;
      const errorMsg = document.getElementById("error-msg");

      if (inputPass === OWNER_PASSWORD) {
        sessionStorage.setItem("isOwnerLoggedIn", "true");
        window.location.href = "dashboard.html";
      } else {
        errorMsg.style.display = "block";
      }
    });

    // Inisialisasi Background Interaktif Particles.js
    if (typeof particlesJS !== 'undefined') {
      particlesJS("particles-js", {
        "particles": {
          "number": { "value": 70, "density": { "enable": true, "value_area": 800 } },
          "color": { "value": "#2b2b2b" },
          "shape": { "type": "circle" },
          "opacity": { "value": 0.5 },
          "size": { "value": 3, "random": true },
          "line_linked": { "enable": true, "distance": 150, "color": "#2b2b2b", "opacity": 0.4, "width": 1 },
          "move": { "enable": true, "speed": 3 }
        },
        "interactivity": {
          "events": {
            "onhover": { "enable": true, "mode": "grab" },
            "onclick": { "enable": true, "mode": "push" }
          },
          "modes": { "grab": { "distance": 180, "line_linked": { "opacity": 0.8 } } }
        },
        "retina_detect": true
      });
    }
  </script>
</body>
</html>
